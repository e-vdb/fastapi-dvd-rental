version: "3.9"

services:
  db:
    image: postgres:16
    container_name: dvdrental_db
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./dvdrental.tar:/docker-entrypoint-initdb.d/dvdrental.tar:ro
      - ./infra/docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dvdrental"]
      interval: 5s
      retries: 5

  api:
    build: .
    container_name: dvdrental_api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    command: >
      uv run uvicorn app.app:app --host 0.0.0.0 --port 8000

volumes:
  db-data:

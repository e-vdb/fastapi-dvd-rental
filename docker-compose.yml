version: "3.9"

services:
  db:
    image: postgres:16
    container_name: dvdrental_db
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./dvdrental.tar:/docker-entrypoint-initdb.d/dvdrental.tar:ro
      - ./infra/docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dvdrental"]
      interval: 5s
      retries: 5

  api:
    image: ghcr.io/e-vdb/fastapi-dvd-rental:dev
    container_name: dvdrental_api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    command: >
      uv run uvicorn app.app:fastapi_app --host 0.0.0.0 --port 8000

# Nginx reverse proxy (replaces Caddy)
  nginx:
    image: nginx:alpine
    container_name: dvdrental-nginx
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx configuration
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL certificates (adjust filenames to match yours!)
      - ./192.168.0.177+2.pem:/etc/nginx/certs/cert.pem:ro
      - ./192.168.0.177+2-key.pem:/etc/nginx/certs/key.pem:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"

volumes:
  db-data:
